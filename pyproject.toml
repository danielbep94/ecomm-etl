[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomm-etl"
version = "3.2.3"
description = "Month/year e-commerce ETL for Databricks and Snowflake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "snowflake-connector-python>=3.12,<5",
    "cryptography>=44,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.10,<1", "pyspark>=3.5,<4.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conf*", "logs*", "src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.setuptools.package-data]
conf = ["*.sql"]
